name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *' # daily, detects API changes
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, openssl
          coverage: none
      # Supported Laravel versions (11+) require PHP 8.2; Composer refuses older, end-of-life Laravel releases.
      - name: Remove Laravel test dependencies
        if: matrix.php == '8.0' || matrix.php == '8.1'
        run: composer remove --dev --no-update orchestra/testbench
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - name: Laravel tests
        if: matrix.php != '8.0' && matrix.php != '8.1'
        run: vendor/bin/phpunit --testsuite laravel

  integration:
    needs: tests
    # Secrets are not available to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Avoid parallel runs competing for the throttling limit of the API key.
    concurrency:
      group: integration-tests
      cancel-in-progress: false
    name: Integration (SaaS, EU)
    env:
      ATTACHMENTAV_API_KEY: ${{ secrets.ATTACHMENTAV_API_KEY }}
    steps:
      - name: Check API key
        run: |
          if [ -z "$ATTACHMENTAV_API_KEY" ]; then
            echo "::error::The ATTACHMENTAV_API_KEY secret is not set."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, openssl
          coverage: none
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpunit --testsuite integration --testdox
