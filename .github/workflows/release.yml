name: Release

# Push a tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) to publish a release.
# Packagist picks up new tags via the GitHub webhook; this workflow verifies the release, runs all tests,
# creates the GitHub Release, and asks Packagist to update right away.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Check that the tag matches AttachmentAVApi::VERSION
        run: |
          version=$(php -r 'require "src/AttachmentAVApi.php"; echo AttachmentAV\AttachmentAVApi::VERSION;')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match AttachmentAVApi::VERSION ($version)."
            exit 1
          fi
      - run: composer validate --strict --no-check-lock

  # All tests: unit tests on PHP 8.0-8.5, Laravel tests, and integration tests against the attachmentAV API.
  tests:
    needs: check
    uses: ./.github/workflows/tests.yml
    secrets:
      ATTACHMENTAV_API_KEY: ${{ secrets.ATTACHMENTAV_API_KEY }}

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

      # Optional: set the PACKAGIST_USERNAME and PACKAGIST_TOKEN secrets (API token from
      # https://packagist.org/profile/) to update Packagist even if the webhook is missing.
      - name: Update Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_TOKEN" ]; then
            echo "PACKAGIST_USERNAME/PACKAGIST_TOKEN not set, relying on the Packagist GitHub webhook."
            exit 0
          fi
          curl --fail-with-body -sS -X POST -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository": {"url": "https://packagist.org/packages/attachmentav/virus-scan-sdk"}}'
